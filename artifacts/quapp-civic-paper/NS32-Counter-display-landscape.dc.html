<html lang="en">
<head>
<meta charset="utf-8">
<title>32 Counter display (landscape)</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
/* ================= Device + Civic Paper tokens ================= */
.dev{width:360px;height:800px;border-radius:36px;background:#F2EDE3;overflow:hidden;position:relative;flex:none;
  --paper:#F2EDE3;--raised:#FBF8F2;--sunk:#E9E2D4;--sunk2:#E1D9C9;--grain:#4F4A40;
  --spot:#2B211C;--on-spot:#F6EFE6;--on-spot2:#D2C4B4;--spot-line:#4A3A30;
  --crema:#C8A27A;--roast:#6B4A2F;--signal:#F2C14E;--on-signal:#1C140E;--signal-ink:#7A5600;
  --bg:var(--paper);--s1:var(--raised);--s2:var(--sunk);--s3:var(--sunk2);
  --ink:#17150F;--ink2:#4F4A40;--ink3:#6E6859;--line:#D8CFBE;--outline:#8C8474;
  --pri:#17150F;--on-pri:#FBF8F2;--tonal:var(--sunk);--on-tonal:#17150F;--call:var(--signal);--on-call:var(--on-signal);--call-ink:var(--signal-ink);
  --ok:#2F6B47;--ok-soft:#DCEAD9;--warn:#80590C;--warn-soft:#F1E5C8;--err:#B3261E;--err-soft:#F6DCD8;--on-err:#FFFFFF;
  --font:'IBM Plex Sans',system-ui,sans-serif;--display:'DM Serif Display',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  --punch:9px;--py:50%;--px:50%}
.dev.tall{height:auto}
.dev.land{width:800px;height:360px;border-radius:28px}

/* The spotlight: charcoal ticket. Remaps the roles so everything inside reads on dark. */
.spot,.spot-ground{--ink:var(--on-spot);--ink2:var(--on-spot2);--ink3:#AD9E8C;--line:var(--spot-line);--outline:var(--on-spot2);
  --pri:var(--on-spot);--on-pri:var(--spot);--tonal:var(--spot-line);--on-tonal:var(--on-spot);--s2:var(--spot-line);
  --ok:#9FD9B0;--ok-soft:rgba(159,217,176,.14);--warn:#E9C77E;--warn-soft:rgba(233,199,126,.14);--err:#F2A69C;--err-soft:rgba(242,166,156,.14);
  color:var(--ink)}
.spot{background:var(--spot);border-radius:10px;box-shadow:none;
  -webkit-mask:radial-gradient(circle var(--punch) at 0 var(--py),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--punch) at 100% var(--py),#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle var(--punch) at 0 var(--py),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--punch) at 100% var(--py),#0000 97%,#000) right/51% 100% no-repeat}
.spot.nopunch{-webkit-mask:none;mask:none}
.spot-ground{background:var(--spot)!important}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;color:var(--ink);font:400 15px/1.45 var(--font);overflow:hidden;border-radius:inherit;background-color:var(--paper)}
.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.dev.tall .scr{position:relative}
.sb{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font:500 13px/1 Roboto,system-ui,sans-serif;position:relative;z-index:3}
.sb .ic{display:flex;gap:5px;align-items:center}
.sb svg{width:15px!important;height:15px!important}
.gn{height:18px;flex:none;display:grid;place-items:center;position:relative;z-index:6}
.gn::after{content:"";width:108px;height:4px;border-radius:2px;background:var(--ink);opacity:.45}
.body{flex:1;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column}
.dev.tall .body{overflow:visible}
.scroll{flex:1;min-height:0;overflow:hidden;padding:0 16px}
.dev.tall .scroll{overflow:visible}

svg.lucide,svg.cat{width:20px;height:20px;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--crema);color:#17150F}

/* ================= Primitives ================= */
button,a,input,textarea{font:inherit;color:inherit}
.scr button:focus-visible,.scr a:focus-visible,.scr input:focus-visible{outline:2px solid var(--crema);outline-offset:2px;box-shadow:0 0 0 1px var(--ink)}
.ib{width:48px;height:48px;display:grid;place-items:center;background:none;border:0;color:var(--ink);cursor:pointer;flex:none;border-radius:50%;text-decoration:none}
.ib svg{width:22px;height:22px}
.appbar{height:60px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px;position:relative}
.appbar .t{flex:1;min-width:0;font:600 17px/1.25 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .t small{display:block;font:400 13px/1.3 var(--font);color:var(--ink2)}
.appbar .t.pl{padding-left:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:10px;font:600 15px/1.2 var(--font);border:0;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.lg{min-height:56px;font-size:16px}
.btn.xl{min-height:64px;font-size:18px;font-weight:700}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:48px;padding:0 12px}
.btn.filled{background:var(--pri);color:var(--on-pri)}
.btn.tonal{background:var(--tonal);color:var(--on-tonal)}
.btn.outlined{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--outline)}
.btn.text{background:none;padding:0 12px;color:var(--roast)}
.spot .btn.text,.spot-ground .btn.text{color:var(--crema)}
.btn.call{background:var(--signal);color:var(--on-signal)}
.btn.danger{background:none;color:var(--err);padding:0 12px}
.btn.danger-f{background:var(--err);color:var(--on-err)}
.btn[aria-disabled="true"]{background:var(--sunk);color:var(--ink3);cursor:not-allowed}
.status{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;flex:none}
.status i{width:6px;height:6px;border-radius:50%;background:currentColor}
.status svg{width:14px;height:14px}
.st-open{color:var(--ok);background:var(--ok-soft)}
.st-up,.st-wait{color:var(--ink2);background:var(--sunk)}
.spot .st-up,.spot .st-wait{background:var(--spot-line)}
.st-paused{color:var(--warn);background:var(--warn-soft)}
.st-closed{color:var(--ink2);box-shadow:inset 0 0 0 1px var(--outline)}
.st-served{color:var(--ok);background:var(--ok-soft)}
.st-noshow{color:var(--err);background:var(--err-soft)}
.st-called{color:var(--signal);background:var(--spot)}
.tile{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;background:var(--sunk);color:var(--ink);flex:none}
.tile svg{width:20px;height:20px}
.card{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px}
.muted{color:var(--ink2)}
.t-small{font:400 13px/1.4 var(--font);color:var(--ink2)}
.t-body{font:400 15px/1.45 var(--font);color:var(--ink2)}
.sec{font:600 15px/1.3 var(--font)}
.count{font:500 12px/1.33 var(--mono);color:var(--ink2);padding:16px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.h-disp{font:400 32px/1.1 var(--display);letter-spacing:-.005em;text-wrap:balance}
.h-disp.md{font-size:28px}
.h-disp.sm{font-size:22px;line-height:1.18}
.h-disp.call{color:var(--signal-ink)}
.spot-ground .h-disp.call{color:var(--signal)}

/* numerals: printed ticket numbers (serif) and tallies (mono) */
.bn{position:relative;display:inline-block;font-family:var(--display);font-weight:400;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bn .gh{display:none}
.bn .v{position:relative}
.bn.tally{font-family:var(--mono);font-weight:600;letter-spacing:-.03em;line-height:1}
.spot .struck .v,.spot-ground .struck .v{color:var(--signal)}
.bn.dim .v{color:var(--ink3)}

/* chips */
.chips{display:flex;gap:8px;overflow:hidden;padding:0 16px;flex:none;position:relative;-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.chips.wrap{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;padding:0}
.chip{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;font:500 14px/1 var(--font);background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--outline);border:0;cursor:pointer;white-space:nowrap;text-decoration:none}
.chip::before{content:"";position:absolute;inset:-4px 0}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--raised);box-shadow:none}
.chip .n{font:500 12px/1 var(--mono);color:var(--ink2)}
.chip[aria-pressed="true"] .n{color:var(--on-spot2)}
.chip.drop{background:var(--sunk);box-shadow:none;position:sticky;left:0;z-index:2}

/* nav */
.nav{height:80px;flex:none;display:flex;background:var(--raised);border-top:1px solid var(--line);position:relative;z-index:2}
.nav a{flex:1;display:grid;justify-items:center;align-content:center;gap:4px;text-decoration:none;color:var(--ink2);font:500 12.5px/1.2 var(--font)}
.nav a .ind{width:64px;height:32px;border-radius:999px;display:grid;place-items:center;position:relative}
.nav a[aria-current="page"]{color:var(--ink);font-weight:700}
.nav a[aria-current="page"] .ind{background:var(--sunk)}
.badge{position:absolute;top:-4px;left:38px;height:18px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--raised);font:600 11px/18px var(--mono);box-shadow:0 0 0 2px var(--raised);white-space:nowrap}
.badge.call{background:var(--spot);color:var(--signal)}

/* lists */
.li{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 0;text-decoration:none;color:inherit}
.li + .li{border-top:1px solid var(--line)}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font:600 15px/1.3 var(--font)}
.li .main span{display:block;font:400 13px/1.4 var(--font);color:var(--ink2)}
.li > svg.lucide{color:var(--ink2)}
.li .end{text-align:right;flex:none}
.li .end b{display:block;font:600 22px/1.1 var(--mono);letter-spacing:-.02em}
.li .end span{font:400 12.5px/1.3 var(--font);color:var(--ink2)}

/* dock, snackbar */
.dock{flex:none;padding:12px 16px;display:flex;gap:12px;align-items:center;background:var(--paper);border-top:1px solid var(--line);position:relative;z-index:2}
.dock.col{flex-direction:column;align-items:stretch;gap:4px}
.snack{position:absolute;left:12px;right:12px;display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 4px 4px 16px;border-radius:6px;background:var(--spot);color:var(--on-spot);font:500 14px/1.35 var(--font);box-shadow:0 2px 6px rgba(23,21,15,.18),0 8px 20px -6px rgba(23,21,15,.22);z-index:4}
.snack .btn,.snack .btn.text{color:var(--crema);text-decoration:underline;text-underline-offset:3px;font-weight:700}

/* switch, segmented, radio */
.sw{width:52px;height:32px;border-radius:16px;position:relative;flex:none;background:var(--sunk);box-shadow:inset 0 0 0 2px var(--outline);border:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:all .2s cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--ink);box-shadow:none}
.sw[aria-checked="true"]::after{left:24px;top:4px;width:24px;height:24px;background:var(--raised)}
.sw[aria-disabled="true"]{opacity:.45}
.seg{display:flex;border-radius:999px;box-shadow:inset 0 0 0 1px var(--outline);overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:none;font:500 14px/1 var(--font);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;position:relative}
.seg button::before{content:"";position:absolute;inset:-2px 0}
.seg button + button{box-shadow:-1px 0 0 var(--outline)}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--ink);color:var(--raised);font-weight:600}
.seg svg{width:16px;height:16px}
.radio{display:flex;align-items:center;gap:14px;min-height:56px;padding:4px 0;border:0;background:none;width:100%;text-align:left;cursor:pointer;color:inherit}
.radio + .radio{border-top:1px solid var(--line)}
.radio .dot{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--outline);flex:none;position:relative}
.radio[aria-checked="true"] .dot{box-shadow:inset 0 0 0 2px var(--ink)}
.radio[aria-checked="true"] .dot::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--ink)}
.radio .main{flex:1}
.radio .main b{display:block;font:600 15px/1.3 var(--font)}
.radio .main span{font:400 13px/1.3 var(--font);color:var(--ink2)}

/* fields */
.field{display:grid;gap:6px}
.field label{font:500 14px/1.3 var(--font)}
.field .box{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 4px 0 14px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--outline);background:var(--raised)}
.field .box input,.field .box textarea{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:400 16px/1.3 var(--font);padding:12px 0;caret-color:var(--roast)}
.field .box textarea{resize:none;min-height:72px}
.field .box input::placeholder,.field .box textarea::placeholder{color:var(--ink3)}
.field .box.sel{justify-content:space-between;padding-right:12px;font:400 15px/1 var(--font);text-align:left;white-space:nowrap;border:0;color:var(--ink);cursor:pointer;width:100%}
.field .help{font:400 13px/1.35 var(--font);color:var(--ink2)}
.field.error .box{box-shadow:inset 0 0 0 2px var(--err)}
.field.error .help{color:var(--err);display:flex;gap:6px;align-items:center}
.field.error .help svg{width:16px;height:16px}
.field .row{display:flex;justify-content:space-between}
.form{display:grid;gap:16px}

/* banners, notes, empty, skeleton */
.note{display:flex;gap:12px;padding:12px 16px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);font:400 13.5px/1.45 var(--font);background:var(--raised)}
.note > svg{color:var(--ink2);margin-top:1px}
.note.warn{background:var(--warn-soft);box-shadow:none}
.note.warn > svg{color:var(--warn)}
.banner{display:flex;gap:12px;align-items:center;padding:10px 8px 10px 16px;background:var(--warn-soft);box-shadow:inset 0 -1px 0 var(--line);font:500 14px/1.35 var(--font);flex:none;position:relative}
.banner svg{color:var(--warn)}
.banner .main{flex:1}
.banner .main span{display:block;font-weight:400;font-size:13px;color:var(--ink2)}
.empty{display:grid;justify-items:start;gap:10px;padding:24px 4px}
.empty .ico{width:56px;height:56px;border-radius:6px;display:grid;place-items:center;background:var(--sunk);color:var(--ink2)}
.empty .ico svg{width:26px;height:26px}
.empty h2{font:400 22px/1.18 var(--display)}
.empty p{color:var(--ink2);font-size:14.5px}
.sk{background:linear-gradient(90deg,var(--sunk),var(--sunk2),var(--sunk));background-size:200% 100%;border-radius:4px}
.skcard{padding:16px;margin-bottom:12px;display:grid;gap:10px}

/* sheets, dialogs, notifications */
.scrim{position:absolute;inset:0;background:rgba(23,21,15,.4);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--raised);border-radius:16px 16px 0 0;box-shadow:0 -1px 0 var(--line);padding:10px 16px 30px;display:flex;flex-direction:column}
.sheet .grab{width:32px;height:4px;border-radius:2px;background:var(--outline);align-self:center;margin-bottom:16px}
.sheet h2,.dialog h2{font:400 22px/1.18 var(--display)}
.sheet .lead,.dialog .lead{color:var(--ink2);font-size:14.5px;margin-top:6px}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);z-index:6;background:var(--raised);border-radius:10px;box-shadow:0 0 0 1px var(--line),0 20px 40px rgba(23,21,15,.2);padding:24px 20px 12px}
.dialog .acts{display:flex;justify-content:flex-end;gap:4px;margin-top:20px}
.notif{position:absolute;left:10px;right:10px;top:36px;z-index:6;background:var(--raised);border-radius:16px;box-shadow:0 0 0 1px var(--line),0 20px 40px rgba(23,21,15,.2);padding:12px 14px 10px}
.notif.spot{background:var(--spot);box-shadow:0 20px 40px rgba(23,21,15,.3)}
.notif .app{display:flex;align-items:center;gap:8px;font:400 12.5px/1 Roboto,sans-serif;color:var(--ink2)}
.logo{width:20px;height:20px;border-radius:5px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:400 15px/1 var(--display)}
.spot .logo{background:var(--crema);color:#17150F}
.notif .acts{display:flex;gap:8px;margin-top:10px}

/* ================= Screen-specific ================= */
.hello{padding:12px 16px 0;position:relative}
.hello p{font:400 14px/1.3 var(--font);color:var(--ink2)}
.hello h1{font:400 32px/1.1 var(--display);margin-top:4px}
.hello .sub{margin-top:4px}
.hello .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

/* "You're in line" banner: the slim spotlight */
.myline{margin:16px 16px 0;display:flex;align-items:center;gap:14px;min-height:72px;padding:10px 12px 10px 20px;text-decoration:none;flex:none;--punch:6px}
.myline > .bn{font-size:34px;padding-right:14px;border-right:1.5px dashed var(--crema);line-height:1.15}
.myline .main{flex:1;min-width:0}
.myline .main b{display:block;font:600 14px/1.3 var(--font)}
.myline .main span{display:block;font:500 13px/1.35 var(--mono);color:var(--ink2);letter-spacing:-.01em}
.myline > svg{color:var(--ink2)}
.myline.card{background:var(--raised)}
.myline.card > .bn{border-right-color:var(--line)}

.search{margin:12px 16px 12px;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);flex:none;background:var(--raised);position:relative}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:400 15px/1 var(--font);outline:none}
.search input::placeholder{color:var(--ink3)}
.search.filled input{color:var(--ink)}
.qc{display:block;padding:16px;text-decoration:none;color:inherit;margin-bottom:12px}
.qc .top{display:flex;gap:12px}
.qc .top .main{flex:1;min-width:0}
.qc .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.qc h3{font:600 16px/1.3 var(--font)}
.qc .cat{font:400 13px/1.4 var(--font);color:var(--ink2)}
.qc .desc{font:400 13.5px/1.4 var(--font);color:var(--ink2);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc .when{display:flex;align-items:center;gap:8px;margin-top:6px;font:400 13px/1.4 var(--font);color:var(--ink2)}
.qc .when svg{width:15px;height:15px}
.qc .when .r{margin-left:auto;white-space:nowrap}
.qc .stats{display:flex;white-space:nowrap;gap:16px;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font:400 13px/1.3 var(--font);color:var(--ink2)}
.qc .stats b{font:600 22px/1 var(--mono);color:var(--ink);margin-right:3px;letter-spacing:-.02em}
.qc .stats .loc{margin-left:auto;display:inline-flex;gap:5px;align-items:center;font-size:12.5px}
.qc .stats .loc svg{width:14px;height:14px}
.qc .stats .muted-s{font-size:13px}
.hl{display:block;margin:12px 16px 0;padding:16px;text-decoration:none;color:inherit;flex:none;position:relative}
.hl .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hl .bn{font-size:34px}

.dt h1{font:400 32px/1.1 var(--display);margin:12px 0 6px;text-wrap:balance}
.org{display:flex;align-items:center;gap:6px;font:500 14px/1.3 var(--font);color:var(--ink2)}
.org svg{width:17px;height:17px;color:var(--ok)}
.st3{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 0;margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.st3 div + div{padding-left:12px;border-left:1px solid var(--line)}
.st3 b{display:block;font:600 22px/1.1 var(--mono);letter-spacing:-.02em}
.st3 span{font:500 11px/1.4 var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.rule{display:flex;gap:12px;padding:10px 0}
.rule + .rule{border-top:1px solid var(--line)}
.rule > svg{margin-top:1px;color:var(--ink2)}
.rule.on > svg{color:var(--ok)}
.rule b{display:block;font:600 14.5px/1.3 var(--font)}
.rule span{display:block;font:400 13px/1.4 var(--font);color:var(--ink2)}
